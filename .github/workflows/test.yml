name: tests

# Not on every commit: push to the build/test branch, a release tag v*, or run by hand
# (Actions → tests → Run workflow, any branch).
on:
  workflow_dispatch:
  push:
    branches: [build/test]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  telegram-memory:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out Telegram Memory
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Validate release identity
        if: startsWith(github.ref, 'refs/tags/v')
        run: test "${GITHUB_REF_NAME}" = "v$(tr -d '[:space:]' < VERSION)"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test
